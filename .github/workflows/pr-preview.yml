name: PR Release Preview

# Posts (and keeps updated) a sticky comment on each pull request showing the
# next version per package and a preview of the release notes. Re-renders when
# an `@super-release release-notes` comment is added, edited or deleted.

on:
  pull_request:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Release preview
    if: github.event_name == 'pull_request'
    # Job-level so unrelated comments (skipped below) can't cancel a running preview.
    concurrency:
      group: pr-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags are required to compute version bumps.
          fetch-depth: 0

      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build super-release
        run: cargo build --release

      - name: Post release preview
        run: ./target/release/super-release --preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  comment-preview:
    name: Release preview (release-notes comment)
    # PR comments mentioning super-release now or before an edit; never its own.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '@super-release') ||
       contains(github.event.changes.body.from, '@super-release')) &&
      !contains(github.event.comment.body, '<!-- super-release:')
    concurrency:
      group: pr-preview-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      # Comment events run with a write token even for fork PRs, so super-release is
      # built from the default branch and the PR is only read, never built or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build super-release
        run: cargo build --release

      - name: Check out the pull request
        env:
          PR: ${{ github.event.issue.number }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR}/head"
          git worktree add --detach "$RUNNER_TEMP/pr" FETCH_HEAD

      - name: Post release preview
        run: ./target/release/super-release --preview -C "$RUNNER_TEMP/pr"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
