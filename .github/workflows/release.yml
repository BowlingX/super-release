name: Release

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['main', 'master']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  # For the github step's "released" comments and labels on resolved PRs/issues.
  issues: write
  pull-requests: write
  # For pushing the Docker image to GHCR.
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
      - run: pnpm install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract super-release binary
        run: |
          tar xzf artifacts/super-release-linux-x86_64/super-release-linux-x86_64.tar.gz -C artifacts
          chmod +x artifacts/super-release

      - name: Bundle artifact hashes into npm package
        run: |
          find artifacts -name '*.sha256' -exec cp {} packages/super-release/bin/ \;
          ls -la packages/super-release/bin/*.sha256

      - name: Run super-release
        id: run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          before="$(git rev-parse HEAD)"
          ./artifacts/super-release
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Publish the Docker image + move the vN tag, only if a release happened ----

      - name: Resolve image version
        id: img
        if: steps.run.outputs.released == 'true'
        run: |
          v="$(node -p "require('./packages/super-release/package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.run.outputs.released == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.run.outputs.released == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.run.outputs.released == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.run.outputs.released == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SR_VERSION=${{ steps.img.outputs.version }}
          tags: |
            ghcr.io/bowlingx/super-release:${{ steps.img.outputs.version }}
            ghcr.io/bowlingx/super-release:v${{ steps.img.outputs.major }}
            ghcr.io/bowlingx/super-release:latest
            ghcr.io/bowlingx/super-release:sha-${{ github.sha }}

      - name: Move major (vN) tag for the Action
        if: steps.run.outputs.released == 'true'
        run: |
          major="v${{ steps.img.outputs.major }}"
          git tag -f "$major"
          git push -f origin "$major"
